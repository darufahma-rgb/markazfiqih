<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c1d28"/>
      <stop offset="100%" stop-color="#a32331"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c1d28" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle border inner -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#c8a96e" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#c8a96e" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Logo symbol -->
  <g transform="translate(600, 190) scale(1.4) translate(-60, -50)">
    <path d="M10 20 L60 50 L110 20 L110 80 L60 100 L10 80 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60 50 L60 100" fill="none" stroke="#ffffff" stroke-width="6"/>
    <path d="M60 25 L85 45 L60 65 L35 45 Z" fill="#c8a96e"/>
  </g>

  <!-- Title -->
  <text x="600" y="345" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="64" font-weight="bold" letter-spacing="2">
    Kelas Markaz Fiqih
  </text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" fill="#f4e4c1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="400">
    Ahlan wa Sahlan di Kelas Markaz Fiqih
  </text>
  <text x="600" y="465" text-anchor="middle" fill="#e2d1a8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="400">
    Tempat belajar fiqih madzhab Syafi'i yang sistematis dan terstruktur.
  </text>

  <!-- Badge -->
  <rect x="420" y="520" width="360" height="42" rx="21" fill="#c8a96e" fill-opacity="0.25" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="600" y="547" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">
    KELASMARKAZFIQIH.COM
  </text>
</svg>